[project]
name = "unitcompute"
version = "0.1.0"
description = "Approval-gated single-VM EC2 provisioning service with a LangChain assistant"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pyjwt[crypto]>=2.15,<3",
    "boto3>=1.43,<2",
    "langchain>=1.4,<2",
    "langchain-core>=1.7,<2",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.7,<2"]
openai = ["langchain-openai>=1.7,<2"]

[project.scripts]
unitcompute-api = "unitcompute.api.main:run"
unitcompute-worker = "unitcompute.worker:main"
unitcompute-admin = "unitcompute.admin:main"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "httpx>=0.28,<0.29",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "pip-audit>=2.10,<3",
    "moto[ec2,ssm,sts]>=5.2,<6",
    "boto3-stubs[ec2,ssm,sts]>=1.43,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unitcompute"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "PL", "PT", "TRY", "ASYNC"]
ignore = [
    "PLR0913",  # explicit keyword-only service signatures
    "PLR2004",
    "TRY003",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR0917",
    "TRY300",
    "TRY301",  # JobFailure is raised and handled within one worker step
    "PLC0415",  # optional provider integrations are imported lazily
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "S603", "S607", "PLC0415", "PT018", "PT006"]
# Mutants hold byte-exact source snippets and pytest node IDs; wrapping them hides mismatches.
"scripts/check_guards.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["unitcompute"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "terraform: requires the pinned terraform binary (offline, no AWS credentials)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
