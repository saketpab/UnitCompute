[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["terraform: runs the real terraform binary against a local moto server"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["unitcompute_vm"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
